name: xiaozhi-server tests

on:
  push:
    paths:
      - "main/xiaozhi-server/**"
      - ".github/workflows/xiaozhi-server-tests.yml"
      - ".github/workflows/docker-image.yml"
  pull_request:
    paths:
      - "main/xiaozhi-server/**"
      - ".github/workflows/xiaozhi-server-tests.yml"
  workflow_call:
  workflow_dispatch:

jobs:
  unit-tests:
    name: Gateway unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: main/xiaozhi-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
