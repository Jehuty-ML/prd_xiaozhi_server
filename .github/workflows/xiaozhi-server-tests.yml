name: xiaozhi-server tests (retired)

# 第六期起门禁已迁至 xiaozhi-microserver-tests.yml。
# 本 workflow 仅保留手工触发，便于对照历史单体测试。

on:
  workflow_dispatch:

jobs:
  unit-tests:
    name: Gateway unit tests (legacy monolith)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: main/xiaozhi-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
