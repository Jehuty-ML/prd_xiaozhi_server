name: xiaozhi-microserver tests

on:
  push:
    paths:
      - "main/xiaozhi-microserver/**"
      - ".github/workflows/xiaozhi-microserver-tests.yml"
      - ".github/workflows/docker-image.yml"
  pull_request:
    paths:
      - "main/xiaozhi-microserver/**"
      - ".github/workflows/xiaozhi-microserver-tests.yml"
  workflow_call:
  workflow_dispatch:

jobs:
  unit-tests:
    name: Microserver unit tests
    runs-on: ubuntu-latest
    # Unit suite is normally <1 min; avoid burning ~1h on hung pip/runner.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: main/xiaozhi-microserver
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: main/xiaozhi-microserver/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-timeout

      - name: Generate proto
        run: python common/generate_proto.py

      - name: Run unit tests
        run: python scripts/run_tests.py --unit-only
        timeout-minutes: 8
        env:
          # Extra belt-and-suspenders if a test forgets to disable MQ.
          XIAOZHI_UNIT_TEST: "1"
          PYTEST_ADDOPTS: "--timeout=30 --timeout-method=thread -vv --durations=20"
