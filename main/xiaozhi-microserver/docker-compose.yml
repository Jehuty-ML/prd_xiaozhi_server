# Phase-6 local compose (no Nacos). Use --peer for cross-container discovery.
# Production: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  xiaozhi-control-admin:
    image: python:3.12-slim
    working_dir: /app/xiaozhi-control-admin
    volumes:
      - ./:/app
    command: >
      bash -c "pip install -q -r /app/requirements.txt &&
      python main.py --env=dev --disable_nacos --grpc_port 50056 --http_port 8003"
    ports:
      - "8003:8003"
      - "50056:50056"

  xiaozhi-audio-receiver:
    image: python:3.12-slim
    working_dir: /app/xiaozhi-audio-receiver
    volumes:
      - ./:/app
    command: >
      bash -c "pip install -q -r /app/requirements.txt &&
      python main.py --env=dev --disable_nacos --grpc_port 50055"
    ports:
      - "50055:50055"

  xiaozhi-access:
    image: python:3.12-slim
    working_dir: /app/xiaozhi-access
    volumes:
      - ./:/app
    command: >
      bash -c "pip install -q -r /app/requirements.txt &&
      python main.py --env=dev --disable_nacos --grpc_port 50051 --http_port 8000
      --peer xiaozhi-audio-preprocess-grpc-service=xiaozhi-audio-preprocess:50054"
    ports:
      - "8000:8000"
      - "50051:50051"

  xiaozhi-audio-speaker:
    image: python:3.12-slim
    working_dir: /app/xiaozhi-audio-speaker
    volumes:
      - ./:/app
    command: >
      bash -c "pip install -q -r /app/requirements.txt &&
      python main.py --env=dev --disable_nacos --grpc_port 50053
      --peer xiaozhi-access-grpc-service=xiaozhi-access:50051"
    ports:
      - "50053:50053"
    depends_on:
      - xiaozhi-access

  xiaozhi-agent:
    image: python:3.12-slim
    working_dir: /app/xiaozhi-agent
    volumes:
      - ./:/app
    command: >
      bash -c "pip install -q -r /app/requirements.txt &&
      python main.py --env=dev --disable_nacos --grpc_port 50052
      --peer xiaozhi-audio-speaker-grpc-service=xiaozhi-audio-speaker:50053"
    ports:
      - "50052:50052"
    depends_on:
      - xiaozhi-audio-speaker

  xiaozhi-audio-preprocess:
    image: python:3.12-slim
    working_dir: /app/xiaozhi-audio-preprocess
    volumes:
      - ./:/app
    command: >
      bash -c "pip install -q -r /app/requirements.txt &&
      python main.py --env=dev --disable_nacos --grpc_port 50054
      --peer xiaozhi-audio-receiver-grpc-service=xiaozhi-audio-receiver:50055
      --peer xiaozhi-agent-grpc-service=xiaozhi-agent:50052
      --peer xiaozhi-access-grpc-service=xiaozhi-access:50051"
    ports:
      - "50054:50054"
    depends_on:
      - xiaozhi-audio-receiver
      - xiaozhi-agent
      - xiaozhi-access
