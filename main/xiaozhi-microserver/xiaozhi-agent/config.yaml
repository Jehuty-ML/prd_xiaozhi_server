server:
  name: xiaozhi-agent
  phase: 3
  environment: development

# Prompt identity injected into agent-base-prompt.txt {{base_prompt}}
prompt: |
  我是小智，一个可爱的智能助手。说话简洁、口语化，像朋友一样。
prompt_template: agent-base-prompt.txt
language: 中文

selected_module:
  LLM: EchoLLM
  # LLM: Doubao
  # LLM: DoubaoLLM   # alias
  # LLM: ChatGLM
  # LLM: ChatGLMLLM  # alias
  Intent: function_call
  Memory: nomem

# EchoLLM: no external key; openai-type needs api_key
LLM:
  EchoLLM:
    type: echo
  OpenAICompatLLM:
    type: openai
    model_name: glm-4-flash
    url: https://open.bigmodel.cn/api/paas/v4/
    api_key: ""
    temperature: 0.7
    max_tokens: 500
  Doubao:
    type: openai
    base_url: https://ark.cn-beijing.volces.com/api/v3
    model_name: doubao-1-5-pro-32k-250115
    api_key: ""
    temperature: 0.7
    max_tokens: 500
  DoubaoLLM:
    type: openai
    base_url: https://ark.cn-beijing.volces.com/api/v3
    model_name: doubao-1-5-pro-32k-250115
    api_key: ""
    temperature: 0.7
    max_tokens: 500
  ChatGLM:
    type: openai
    url: https://open.bigmodel.cn/api/paas/v4/
    model_name: glm-4-flash
    api_key: ""
    temperature: 0.7
    max_tokens: 500
  ChatGLMLLM:
    type: openai
    url: https://open.bigmodel.cn/api/paas/v4/
    model_name: glm-4-flash
    api_key: ""
    temperature: 0.7
    max_tokens: 500

Intent:
  nointent:
    type: nointent
  function_call:
    type: function_call
    functions:
      - get_time
      - get_weather

Memory:
  nomem:
    type: nomem

plugins:
  get_weather:
    api_host: "https://api.open-meteo.com"
  get_time: {}

tool_call_timeout: 30
max_tool_depth: 5
