server:
  name: xiaozhi-agent
  phase: 3
  environment: development
  # LLM hang → fallback speech (chat_engine wall-clock)
  resilience:
    enabled: true
    llm_timeout_seconds: 45
    phrases:
      llm: "主人，小智现在有点忙，我们稍后再试吧。"

# Prompt identity injected into agent-base-prompt.txt {{base_prompt}}
prompt: |
  我是小智，一个可爱的智能助手。说话简洁、口语化，像朋友一样。
prompt_template: agent-base-prompt.txt
language: 中文

selected_module:
  LLM: EchoLLM
  # LLM: Doubao
  # LLM: DoubaoLLM   # alias
  # LLM: ChatGLM
  # LLM: ChatGLMLLM  # alias
  Intent: function_call
  Memory: nomem

# EchoLLM: no external key; openai-type needs api_key
LLM:
  EchoLLM:
    type: echo
  OpenAICompatLLM:
    type: openai
    model_name: glm-4-flash
    url: https://open.bigmodel.cn/api/paas/v4/
    api_key: ""
    temperature: 0.7
    max_tokens: 500
  Doubao:
    type: openai
    base_url: https://ark.cn-beijing.volces.com/api/v3
    model_name: doubao-1-5-pro-32k-250115
    api_key: ""
    temperature: 0.7
    max_tokens: 500
  DoubaoLLM:
    type: openai
    base_url: https://ark.cn-beijing.volces.com/api/v3
    model_name: doubao-1-5-pro-32k-250115
    api_key: ""
    temperature: 0.7
    max_tokens: 500
  ChatGLM:
    type: openai
    url: https://open.bigmodel.cn/api/paas/v4/
    model_name: glm-4-flash
    api_key: ""
    temperature: 0.7
    max_tokens: 500
  ChatGLMLLM:
    type: openai
    url: https://open.bigmodel.cn/api/paas/v4/
    model_name: glm-4-flash
    api_key: ""
    temperature: 0.7
    max_tokens: 500

Intent:
  nointent:
    type: nointent
  function_call:
    type: function_call
    functions:
      - get_time
      - get_weather

Memory:
  nomem:
    type: nomem

plugins:
  get_weather:
    api_host: "https://api.open-meteo.com"
  get_time: {}

tool_call_timeout: 30
max_tool_depth: 5

# Chat history → RabbitMQ (manager-api consumes).
# Compose / 本机联调可开；单元测试会强制关掉，避免 CI 无 broker 时挂死。
chat_history:
  report_enabled: true
rabbitmq:
  enabled: true
  host: 127.0.0.1
  port: 5672
  username: guest
  password: guest
  virtual_host: /
  queue: xiaozhi.chat.history
