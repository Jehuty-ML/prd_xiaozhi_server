syntax = "proto3";

package xiaozhi.audio;

// ---- Common envelopes ----

message AudioChunkRequest {
  string message_id = 1;
  string client_id = 2;
  bytes data = 3;
  string format = 4;  // opus | pcm | raw
  // Optional MQTT/WS media timestamp (ms) for AEC reference matching
  int64 timestamp = 5;
  bool aec_enabled = 6;
  string listen_mode = 7;  // auto | manual | realtime (hint from access)
}

message AudioChunkResponse {
  int32 code = 1;
  string msg = 2;
  string result = 3;
}

message AsrRecognizeRequest {
  string message_id = 1;
  string client_id = 2;
  bytes pcm = 3;
  int32 sample_rate = 4;
}

message AsrRecognizeResponse {
  int32 code = 1;
  string msg = 2;
  string text = 3;
}

message TextRequest {
  string message_id = 1;
  string client_id = 2;
  string text = 3;
}

message TextResponse {
  int32 code = 1;
  string msg = 2;
  string result = 3;
}

message SpeakRequest {
  string message_id = 1;
  string client_id = 2;
  string text = 3;
  string emotion = 4;
  int32 index = 5;
  int32 total = 6;
  // When true, marks end of a speak turn (flush stop). text may be empty.
  bool end = 7;
}

message SpeakResponse {
  int32 code = 1;
  string msg = 2;
  string result = 3;
}

message TtsAudioRequest {
  string message_id = 1;
  string client_id = 2;
  bytes audio = 3;
  string text = 4;
  int32 index = 5;
  int32 total = 6;
  string format = 7;  // opus | pcm | wav | echo
  // Device protocol state: "" (audio only) | start | sentence_start | stop
  string state = 8;
  string session_id = 9;
  // Optional playback timestamp (ms) for AEC reference pairing
  int64 timestamp = 10;
}

message TtsAudioResponse {
  int32 code = 1;
  string msg = 2;
  string result = 3;
}

message DeviceEventRequest {
  string message_id = 1;
  string client_id = 2;
  string event_type = 3;  // mcp | iot
  string payload_json = 4;
}

message DeviceEventResponse {
  int32 code = 1;
  string msg = 2;
  string result = 3;
}

message AgentAbortRequest {
  string message_id = 1;
  string client_id = 2;
  string reason = 3;
}

message AgentAbortResponse {
  int32 code = 1;
  string msg = 2;
  string result = 3;
}

// Access → agent: per-device private config from manager-api /config/agent-models
message ApplySessionConfigRequest {
  string message_id = 1;
  string client_id = 2;
  string device_id = 3;
  string config_json = 4;
  string reason = 5;
}

message ApplySessionConfigResponse {
  int32 code = 1;
  string msg = 2;
  string result = 3;
}

message SpeakerAbortRequest {
  string message_id = 1;
  string client_id = 2;
  string reason = 3;
}

message SpeakerAbortResponse {
  int32 code = 1;
  string msg = 2;
  string result = 3;
}

message BroadcastSpeakRequest {
  string message_id = 1;
  string text = 2;
  string exclude_client_id = 3;
}

message BroadcastSpeakResponse {
  int32 code = 1;
  string msg = 2;
  string result = 3;
  int32 spoken = 4;
}

// Access → preprocess: listen start/stop/detect + mode / AEC flag
message ListenControlRequest {
  string message_id = 1;
  string client_id = 2;
  string state = 3;  // start | stop | detect
  string mode = 4;   // auto | manual | realtime
  string text = 5;   // detect inject text
  bool aec_enabled = 6;
}

message ListenControlResponse {
  int32 code = 1;
  string msg = 2;
  string result = 3;
}

// Speaker (or access) → preprocess: TTS PCM reference for AEC
message AecReferenceRequest {
  string message_id = 1;
  string client_id = 2;
  int64 timestamp = 3;
  bytes pcm = 4;
  string format = 5;  // pcm (int16 LE) | opus
}

message AecReferenceResponse {
  int32 code = 1;
  string msg = 2;
  string result = 3;
}

message PreprocessAbortRequest {
  string message_id = 1;
  string client_id = 2;
  string reason = 3;
}

message PreprocessAbortResponse {
  int32 code = 1;
  string msg = 2;
  string result = 3;
}

// Preprocess: uplink audio from access + VAD session control
service AudioPreprocessService {
  rpc SendAudioChunk(AudioChunkRequest) returns (AudioChunkResponse);
  rpc SendText(TextRequest) returns (TextResponse);
  rpc ControlListen(ListenControlRequest) returns (ListenControlResponse);
  rpc PushAecReference(AecReferenceRequest) returns (AecReferenceResponse);
  rpc Abort(PreprocessAbortRequest) returns (PreprocessAbortResponse);
}

// Receiver: ASR
service AudioReceiverService {
  rpc AsrRecognize(AsrRecognizeRequest) returns (AsrRecognizeResponse);
}

// Agent: dialogue brain (phase-3 LLM / tools / device events)
service AgentService {
  rpc SendText(TextRequest) returns (TextResponse);
  rpc HandleDeviceEvent(DeviceEventRequest) returns (DeviceEventResponse);
  rpc Abort(AgentAbortRequest) returns (AgentAbortResponse);
  rpc ApplySessionConfig(ApplySessionConfigRequest) returns (ApplySessionConfigResponse);
}

// Speaker: TTS (phase-4)
service AudioSpeakerService {
  rpc SpeakText(SpeakRequest) returns (SpeakResponse);
  rpc Abort(SpeakerAbortRequest) returns (SpeakerAbortResponse);
  rpc BroadcastSpeak(BroadcastSpeakRequest) returns (BroadcastSpeakResponse);
}

// Access: downstream TTS / device write-back
service AccessAudioService {
  rpc SendTtsAudio(TtsAudioRequest) returns (TtsAudioResponse);
}
