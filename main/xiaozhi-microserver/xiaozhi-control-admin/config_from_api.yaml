# 复制本文件为 data/.config.yaml 后填写密钥（data/.config.yaml 已 gitignore）。
# 对齐单体 xiaozhi-server/config_from_api.yaml。
#
# 步骤：
#   1. 启动 manager-api / manager-web，用管理员打开【参数管理】复制 server.secret
#   2. mkdir data && copy config_from_api.yaml data\.config.yaml
#   3. 修改下面 url / secret，enabled: true
#   4. 重启 xiaozhi-control-admin

server:
  # 可选：覆盖 websocket / vision_explain / auth_key / admin.token
  websocket: "ws://127.0.0.1:8000/xiaozhi/v1/"
  vision_explain: "http://127.0.0.1:8003/mcp/vision/explain"

manager-api:
  # manager-api 地址（局域网 IP 或 docker 服务名）
  url: "http://127.0.0.1:8002/xiaozhi"
  # 智控台【参数管理】里的 server.secret
  secret: "你的server.secret值"
  enabled: true
