# 模板配置（可提交）。私有密钥请写到 data/.config.yaml，不要改本文件的 secret。
# 用法：对接 manager-api 时
#   1. 复制 config_from_api.yaml → data/.config.yaml
#   2. 填入 manager-api.url / secret，并设 enabled: true
#   3. 重启 xiaozhi-control-admin
#
# 合并顺序：config.yaml < data/.config.yaml < manager-api server-base（绑定端口仍以本地为准）

server:
  name: xiaozhi-microserver
  phase: 2
  environment: development
  # access WS port（与历史单体 server.port=8000 对齐）
  port: 8000
  # control-admin HTTP / OTA / vision（与历史单体 server.http_port=8003 对齐）
  http_port: 8003
  websocket: "ws://127.0.0.1:8000/xiaozhi/v1/"
  vision_explain: "http://127.0.0.1:8003/mcp/vision/explain"
  auth_key: ""
  timezone_offset: 8
  auth:
    enabled: false
    expire_seconds: 2592000
    allowed_devices: []
    allow_whitelist_bypass: true
    devices_allowlist_only: false
  connection:
    max_connections: 200
    max_connections_per_device: 2
  metrics:
    enabled: true
  health:
    liveness_path: /health
    readiness_path: /ready
  admin:
    require_auth: false
    token: ""
  resilience:
    enabled: true
    grpc_timeout_seconds: 30
    asr_timeout_seconds: 15
    llm_timeout_seconds: 90
    tts_timeout_seconds: 60
    max_retries: 2
    retry_delay_seconds: 0.5
    circuit_failure_threshold: 5
    circuit_open_seconds: 30

xiaozhi:
  type: hello
  version: 1
  transport: websocket
  audio_params:
    format: opus
    sample_rate: 24000
    channels: 1
    frame_duration: 60

# 仅作本地缺省；启用 manager-api 后由智控台 server-base / agent-models 覆盖。
selected_module:
  ASR: StubASR
  TTS: EchoTTS
  LLM: EchoLLM

# 占位；真实 url/secret 写到 data/.config.yaml
manager-api:
  url: ""
  secret: ""
  enabled: false
