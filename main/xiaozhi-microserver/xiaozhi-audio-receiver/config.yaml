server:
  name: xiaozhi-audio-receiver
  phase: 5
  environment: development

selected_module:
  ASR: StubASR
  # ASR: FunASR
  # ASR: Doubao
  # ASR: DoubaoASR   # alias of Doubao (manager-api / monolith name)

ASR:
  StubASR:
    type: stub
    fixed_text: "你好"
    min_pcm_bytes: 9600
  OpenAICompatASR:
    type: openai
    model_name: whisper-1
    url: https://api.openai.com/v1/audio/transcriptions
    api_key: ""
    language: zh
    output_dir: tmp/
  FunASR:
    type: fun_local
    # Relative to xiaozhi-server models/ (optional: pip install -r requirements-funasr.txt)
    model_dir: ../../xiaozhi-server/models/SenseVoiceSmall
    language: auto
    output_dir: tmp/
  # Preferred short name
  Doubao:
    type: doubao
    appid: ""
    access_token: ""
    cluster: volcengine_input_common
    boosting_table_name: ""
    correct_table_name: ""
    output_dir: tmp/
  # Monolith / manager-api compatible alias (mirrored by control-admin if needed)
  DoubaoASR:
    type: doubao
    appid: ""
    access_token: ""
    cluster: volcengine_input_common
    boosting_table_name: ""
    correct_table_name: ""
    output_dir: tmp/
