# 鐢熶骇绀轰緥閰嶇疆鐗囨锛堝悎骞惰繘 xiaozhi-control-admin/config.yaml 鎴?overlay锛?
# 瀹屾暣鍙犲姞瑙?deploy/production/config.overlay.yaml

server:
  environment: production
  auth_key: "replace-with-long-random-secret"
  auth:
    enabled: true
    allow_insecure_disable: false
    allow_whitelist_bypass: false
    allowed_devices: []
  admin:
    require_auth: true
    token: "replace-with-long-random-secret"
  connection:
    max_connections: 200
    max_connections_per_device: 2
  resilience:
    enabled: true
  websocket: "wss://voice.example.com/xiaozhi/v1/"
  vision_explain: "https://voice.example.com/mcp/vision/explain"
