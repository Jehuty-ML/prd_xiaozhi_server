# Tomcat
server:
  tomcat:
    uri-encoding: UTF-8
    threads:
      max: 1000
      min-spare: 30
  port: 8002
  servlet:
    context-path: /xiaozhi
    session:
      cookie:
        http-only: true

xiaozhi:
  rabbitmq:
    # 默认关闭；开启后消费 agent 发布的聊天历史并落库
    enabled: false
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    queue: xiaozhi.chat.history

spring:
  # 环境 dev|test|prod
  profiles:
    active: dev
  messages:
    encoding: UTF-8
    basename: i18n/messages
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      enabled: true
  main:
    allow-bean-definition-overriding: true
  rabbitmq:
    host: ${xiaozhi.rabbitmq.host:127.0.0.1}
    port: ${xiaozhi.rabbitmq.port:5672}
    username: ${xiaozhi.rabbitmq.username:guest}
    password: ${xiaozhi.rabbitmq.password:guest}
    virtual-host: ${xiaozhi.rabbitmq.virtual-host:/}
    listener:
      simple:
        auto-startup: ${xiaozhi.rabbitmq.enabled:true}

knife4j:
  enable: true
  basic:
    enable: false
    username: admin
    password: admin
  setting:
    enableFooter: false

renren:
  redis:
    open: true
  xss:
    enabled: true
    exclude-urls:

#mybatis
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  #实体扫描，多个package用逗号或者分号分隔
  typeAliasesPackage: xiaozhi.modules.*.entity
  global-config:
    #数据库相关配置
    db-config:
      #主键类型
      id-type: ASSIGN_ID
    banner: false
  #原生配置
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'
  configuration-properties:
    prefix:
    blobType: BLOB
    boolValue: TRUE