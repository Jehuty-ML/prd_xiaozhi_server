# 生产叠加：仅对话 Server
# 用法：
#   cp .env.example .env   # 可改密钥；XIAOZHI_ENV 会被本文件强制为 production
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# 主线 config.yaml 仍为 development 默认；生产项由 deploy/production/config.overlay.yaml 覆盖

services:
  xiaozhi-esp32-server:
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - XIAOZHI_ENV=production
    volumes:
      - ./data:/opt/xiaozhi-esp32-server/data
      - ./deploy/production/config.overlay.yaml:/opt/xiaozhi-esp32-server/data/.config.yaml:ro
      - ./models/SenseVoiceSmall/model.pt:/opt/xiaozhi-esp32-server/models/SenseVoiceSmall/model.pt
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
