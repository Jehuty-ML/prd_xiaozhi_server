# 生产环境 data/.config.yaml 参考（或直接用 deploy/production 下 overlay）
# - 仅 Server：deploy/production/config.overlay.yaml
# - 全模块：deploy/production/config.overlay.all.yaml
# 用法：docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# 也可用环境变量 XIAOZHI_ENV=production 强制进入生产安全策略（不改主线 config.yaml）

server:
  environment: production
  # 公网 / Docker 请写真实可达地址
  # websocket: wss://voice.example.com/xiaozhi/v1/
  # vision_explain: https://voice.example.com/mcp/vision/explain
  auth:
    enabled: true
    allow_insecure_disable: false
    # production 默认禁止白名单免检；确需免检才显式 true
    allow_whitelist_bypass: false
    # 可选：仅列表内设备可接入
    devices_allowlist_only: false
    allowed_devices: []
  health:
    enabled: true
    liveness_path: /health
    readiness_path: /ready
    reject_when_at_capacity: true
  metrics:
    enabled: true
    path: /metrics
  connection:
    # 按机器规格调整
    max_connections: 200
    max_connections_per_device: 2
  # 多实例 + 智控台 OTA 选路时开启，并指向与 manager-api 同库 Redis
  registry:
    enabled: true
    redis:
      host: 127.0.0.1
      port: 6379
      # password: your-redis-password
      db: 0

# 智控台模式还需要：
# manager-api:
#   url: http://127.0.0.1:8002/xiaozhi
#   secret: <与智控台一致的 secret>
